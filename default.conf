# Where to forward requests that are not files: the "web" service (gunicorn).
# "web" is the service name; Docker's internal DNS turns it into an IP.
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;               # catch-all: answer for any host name

    # Biggest request body allowed (cover uploads). The default is 1M and gives a 413 error.
    client_max_body_size 10M;

    # URLs starting with /static/ are files: Nginx reads them from disk, Django is not involved
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;              # browsers may cache these files for 7 days
        access_log off;          # do not fill the log with one line per CSS file
    }

    # Same idea for uploaded images
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # Everything else is a page: pass it to gunicorn
    location / {
        proxy_pass http://django;
        # Django only sees Nginx as the client, so we pass the original details along:
        proxy_set_header Host $host;                                  # requested host name
        proxy_set_header X-Real-IP $remote_addr;                      # visitor's IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # chain of proxies
        proxy_set_header X-Forwarded-Proto $scheme;                   # http or https
        proxy_redirect off;      # do not rewrite redirect URLs from Django
    }
}